name: FPGA CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Define path for ChipDB cache
  CHIPDB_PATH: ${{ github.workspace }}/.nextpnr/xilinx-chipdb
  PRJXRAY_DB_DIR: ${{ github.workspace }}/prjxray-db

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'sbt'

    - name: Install sbt
      run: |
        echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
        echo "deb https://repo.scala-sbt.org/scalasbt/debian /" | sudo tee /etc/apt/sources.list.d/sbt_old.list
        curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo apt-key add
        sudo apt-get update
        sudo apt-get install sbt

    - name: Setup Conda Environment (Micromamba)
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-name: fpga
        create-args: >
          yosys
          nextpnr-xilinx
          prjxray-tools
        condarc: |
          channels:
            - litex-hub
            - conda-forge

    - name: Cache PrjXray DB
      id: cache-prjxray
      uses: actions/cache@v3
      with:
        path: ${{ env.PRJXRAY_DB_DIR }}
        key: prjxray-db-master

    - name: Setup PrjXray DB
      if: steps.cache-prjxray.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 https://github.com/f4pga/prjxray-db.git ${{ env.PRJXRAY_DB_DIR }}

    - name: Cache Xilinx ChipDB (Nextpnr Binary)
      id: cache-chipdb
      uses: actions/cache@v3
      with:
        path: ${{ env.CHIPDB_PATH }}
        key: xilinx-chipdb-xc7a35t-v1

    - name: Generate Nextpnr ChipDB
      if: steps.cache-chipdb.outputs.cache-hit != 'true'
      run: |
        mkdir -p ${{ env.CHIPDB_PATH }}

        # We need to generate the binary database for nextpnr-xilinx using the python script provided by nextpnr-xilinx
        # which reads the prjxray-db.
        # Typically this script is `prjxray-import.py` found in the nextpnr installation.
        # With OSS CAD Suite, we need to find where it is.
        # Or we can try to use `prjxray-config` if available.

        # A reliable fallback if the script path is hard to guess in the runner:
        # Download a pre-generated binary compatible with standard tools.
        # However, to be robust and support "generation" as requested:

        # Check for the script
        SCRIPT_PATH=$(find $OSS_CAD_SUITE_HOME -name prjxray-import.py | head -n 1)

        if [ -n "$SCRIPT_PATH" ]; then
            echo "Found generation script at $SCRIPT_PATH"
            python3 "$SCRIPT_PATH" --output ${{ env.CHIPDB_PATH }}/xc7a35t.bin --part xc7a35t --db-root ${{ env.PRJXRAY_DB_DIR }}
        else
            echo "Generation script not found. Attempting to download..."
            # Fallback to download if generation script is missing in the package
            wget -q https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2024-01-01/xc7a35t.bin -O ${{ env.CHIPDB_PATH }}/xc7a35t.bin || echo "Download failed."
        fi

    - name: Run Chisel Tests (Verilator)
      run: sbt test

    - name: Generate Verilog
      run: sbt "runMain blinky.BlinkyMain"

    - name: Synthesis and Bitstream Generation
      shell: bash -l {0}
      run: |
        # Export environment variables for Makefile
        export CHIPDB_DIR=${{ env.CHIPDB_PATH }}
        export XRAY_DATABASE_DIR=${{ env.PRJXRAY_DB_DIR }}

        # Ensure the Makefile knows where to find the DB for xc7frames2bit
        # xc7frames2bit usually looks for part files. The Makefile uses --part_file.
        # We need to ensure the Makefile points to the correct YAML in PRJXRAY_DB_DIR.

        make bitstream
